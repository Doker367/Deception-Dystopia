# Heralding — Dystopia sensor configuration.
# Based on the upstream sample, reduced to the protocols used by the decoy
# network. No external callbacks, HPFeeds, syslog or hash cracking.
#
# Upstream: https://github.com/johnnykv/heralding (GPL-3.0)

# Do not resolve the sensor's public IP through ipify. This keeps the
# honeypot from making outbound requests and from recording host egress IPs.
public_ip_as_destination_ip: false

bind_host: 0.0.0.0

activity_logging:
  file:
    enabled: true
    # One JSON object per completed session (JSONL).
    session_json_log_file: "/var/log/heralding/sessions.jsonl"
    # One CSV row per completed session.
    session_csv_log_file: "/var/log/heralding/sessions.csv"
    # One CSV row per authentication attempt, including captured credentials.
    authentication_log_file: "/var/log/heralding/auth.csv"

  syslog:
    enabled: false

  hpfeeds:
    enabled: false

  curiosum:
    enabled: false
    port: 23400

# Hashing every captured password costs CPU and can retain credential-derived
# material. Disabled by default; enable only under an approved analysis policy.
hash_cracker:
  enabled: false
  wordlist_file: 'wordlist.txt'

capabilities:
  ftp:
    enabled: true
    port: 21
    timeout: 30
    protocol_specific_data:
      max_attempts: 3
      banner: "Microsoft FTP Server"
      syst_type: "Windows-NT"

  telnet:
    enabled: true
    port: 23
    timeout: 30
    protocol_specific_data:
      max_attempts: 3

  ssh:
    enabled: true
    port: 22
    timeout: 30
    protocol_specific_data:
      banner: "SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.10"

  http:
    enabled: true
    port: 80
    timeout: 30
    protocol_specific_data:
      banner: ""

  https:
    enabled: true
    port: 443
    timeout: 30
    protocol_specific_data:
      banner: ""
      cert:
        common_name: "files01.dystopia.invalid"
        country: "ES"
        state: "None"
        locality: "None"
        organization: "Dystopia Lab"
        organizational_unit: "Deception"
        valid_days: 365
        serial_number: 0

  smtp:
    enabled: true
    port: 25
    timeout: 30
    protocol_specific_data:
      banner: "Microsoft ESMTP MAIL service ready"
      fqdn: "files01.dystopia.invalid"

  imap:
    enabled: true
    port: 143
    timeout: 30
    protocol_specific_data:
      max_attempts: 3
      banner: "* OK IMAP4rev1 Server Ready"

  pop3:
    enabled: true
    port: 110
    timeout: 30
    protocol_specific_data:
      max_attempts: 3
      banner: "+OK POP3 server ready"

  mysql:
    enabled: true
    port: 3306
    timeout: 30

  postgresql:
    enabled: true
    port: 5432
    timeout: 30

  rdp:
    enabled: true
    port: 3389
    timeout: 30
    protocol_specific_data:
      banner: ""
      cert:
        common_name: "files01.dystopia.invalid"
        country: "ES"
        state: "None"
        locality: "None"
        organization: "Dystopia Lab"
        organizational_unit: "Deception"
        valid_days: 365
        serial_number: 0

  vnc:
    enabled: true
    port: 5900
    timeout: 30
