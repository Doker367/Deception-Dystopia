# Cowrie — configuración de la red señuelo Dystopia.
# Referencia: https://cowrie.readthedocs.io
# Version objetivo: Cowrie 3.1.4 (imagen cowrie/cowrie:3.1.4).
#
# Rutas relativas al WORKDIR de la imagen (/cowrie/cowrie-git). El volumen
# persistente se monta en /cowrie/cowrie-git/var, por lo que log y estado
# quedan fuera del rootfs de solo lectura.

[honeypot]
hostname = srv-files-01
sensor_name = cowrie-srv-files-01
log_path = var/log/cowrie
logtype = plain
state_path = var/lib/cowrie
download_path = var/lib/cowrie/downloads
ttylog = true
ttylog_path = var/lib/cowrie/tty
interactive_timeout = 180
authentication_timeout = 120
backend = shell
auth_class = AuthRandom
auth_class_parameters = 2, 5, 10
timezone = UTC

[shell]
arch = linux-x64-lsb
kernel_version = 6.1.0-21-amd64
kernel_build_string = #1 SMP PREEMPT_DYNAMIC Debian 6.1.90-1
hardware_platform = x86_64
operating_system = GNU/Linux
ssh_version = OpenSSH_9.2p1 Debian-2+deb12u3

[ssh]
enabled = true
version = SSH-2.0-OpenSSH_9.2p1 Debian-2+deb12u3
listen_endpoints = tcp:2222:interface=0.0.0.0
sftp_enabled = true
forwarding = false
forward_redirect = false
forward_tunnel = false
auth_none_enabled = false
auth_keyboard_interactive_enabled = true
auth_publickey_allow_any = true

[telnet]
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0
reported_port = 23

# Log JSON por línea: formato que normaliza el adaptador cowrie_svc.
[output_jsonlog]
enabled = true
logfile = var/log/cowrie/cowrie.json
epoch_timestamp = false

# El log de texto se deja desactivado para no duplicar retención ni
# exposición de credenciales.
[output_textlog]
enabled = false
logfile = var/log/cowrie/cowrie-textlog.log
format = text

[output_crashreporter]
enabled = false
debug = false
