# Dionaea — Dystopia sensor configuration.
# Adapted from upstream dionaea conf/dionaea.cfg.cmake (CC0-1.0).
# Paths are the upstream /opt/dionaea install layout.

[dionaea]
download.dir=/opt/dionaea/var/dionaea/binaries/
modules=curl,python,emu
processors=filter_streamdumper,filter_emu

listen.mode=getifaddrs

# Deliberately generic persona values: no real organization, host or domain.
ssl.default.c=ES
ssl.default.cn=files01.dystopia.invalid
ssl.default.o=Dystopia Lab
ssl.default.ou=Deception

[logging]
default.filename=/opt/dionaea/var/log/dionaea.log
default.levels=warning,error
default.domains=*

errors.filename=/opt/dionaea/var/log/dionaea-errors.log
errors.levels=warning,error,critical
errors.domains=*

[processor.filter_streamdumper]
name=filter
config.allow.0.types=accept
config.allow.1.types=connect
config.allow.1.protocols=ftpctrl
config.deny.0.protocols=ftpdata,ftpdatacon,xmppclient
next=streamdumper

[processor.streamdumper]
name=streamdumper
config.path=/opt/dionaea/var/dionaea/bistreams/%Y-%m-%d/

[processor.filter_emu]
name=filter
config.allow.0.protocols=smbd,epmapper,nfqmirrord,mssqld
next=emu

[processor.emu]
name=emu
config.limits.files=3
config.limits.filesize=524288
config.limits.sockets=3
config.limits.sustain=120
config.limits.idle=30
config.limits.listen=30
config.limits.cpu=120
config.limits.steps=1073741824

[module.nl]
lookup_ethernet_addr=no

[module.python]
imports=dionaea.log,dionaea.services,dionaea.ihandlers
sys_paths=default
service_configs=/opt/dionaea/etc/dionaea/services-enabled/*.yaml
ihandler_configs=/opt/dionaea/etc/dionaea/ihandlers-enabled/*.yaml
