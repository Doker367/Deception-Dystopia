# Endlessh — Dystopia sensor configuration.
# Upstream sample, with standard logging enabled (LogLevel 1).
# https://github.com/skeeto/endlessh (Unlicense)

# The port on which to listen for new SSH connections.
Port 2222

# The endless banner is sent one line at a time. This is the delay
# in milliseconds between individual lines.
Delay 10000

# The length of each line is randomized. This controls the maximum
# length of each line. Shorter lines may keep clients on for longer if
# they give up after a certain number of bytes.
MaxLineLength 32

# Maximum number of connections to accept at a time. Connections beyond
# this are not immediately rejected, but will wait in the queue.
MaxClients 4096

# 0 = quiet, 1 = standard, 2 = debug. One structured line is emitted for
# each ACCEPT/CLOSE plus periodic TOTALS lines.
LogLevel 1

# 4 = IPv4 only. Keeps the artifact deterministic; IPv6 can be enabled
# deliberately in an authorized cell.
BindFamily 4
