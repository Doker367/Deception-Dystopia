name: CI

on:
  push:
    branches:
      - main
      - master
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check app tests

      - name: Tests
        run: pytest tests

  ui-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Contratos de UI y despliegue
        run: pytest -q tests/ui tests/deploy

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Instalar dependencias web
        run: cd web && npm ci

      - name: Build Dystopia Web
        run: cd web && npm run build

      - name: Instalar dependencias E2E
        run: npm ci

      - name: Instalar Chromium headless
        run: npx playwright install --with-deps chromium

      - name: Mapa Playwright (API simulada)
        run: npx playwright test

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Pyright
        run: pyright app --pythonpath "$(which python)"
