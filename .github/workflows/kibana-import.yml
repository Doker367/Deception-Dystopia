name: Kibana import validation

# Validación reproducible del bundle canónico de Kibana contra un stack
# Elasticsearch/Kibana 9.3.5 efímero. No se ejecuta en cada PR (coste alto):
# solo a mano o semanalmente.
on:
  workflow_dispatch:
  schedule:
    # Lunes 04:00 UTC
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: kibana-import-validation
  cancel-in-progress: false

jobs:
  validate-import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Requisito de kernel para Elasticsearch
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Validar import del bundle (53/53)
        run: bash scripts/validate_kibana_import.sh
        env:
          KIBANA_CI_SUMMARY_FILE: ci-artifacts/kibana-import-summary.txt

      - name: Publicar resumen (nunca secretos, certs ni claves)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kibana-import-summary
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 14
