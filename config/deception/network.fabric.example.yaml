# ============================================================
# NetPulse — Ejemplo de Network Fabric (network.fabric.example.yaml)
# ============================================================
# Extensión compatible de network.yaml: `segments`/`devices` conservan
# su esquema actual y el bloque `fabric` añade la red virtual. El
# contenido sigue el §3.2 del spec. Se completaron los segmentos y
# dispositivos que `device_overrides` referencia (el fragmento del spec
# los omite) para que el manifiesto valide de extremo a extremo.
#
# ADVERTENCIA: usar SOLO credenciales señuelo. No reutilizar las
# credenciales reales de devices.yaml. Esta red debe correr aislada.
# ============================================================

# ── Existing keys (unchanged) ──────────────────────────────────
segments:
  - id: vlan-oficina
    vlan_id: 10
    cidr: 10.10.0.0/24
    gateway: 10.10.0.1
    isolated: true
    description: "Puestos de trabajo"

  - id: vlan-servidores
    vlan_id: 20
    cidr: 10.20.0.0/24
    gateway: 10.20.0.1
    isolated: true
    description: "Servidores internos"

  - id: vlan-camaras
    vlan_id: 30
    cidr: 10.30.0.0/24
    gateway: 10.30.0.1
    isolated: true
    description: "Videovigilancia IP"

devices:
  - id: pc-recepcion-01
    role: pc
    segment: vlan-oficina
    ip: 10.10.0.21
    persona:
      vendor: dell
      os: windows
      hostname: RECEPCION-PC
      mac: "00:1c:42:10:10:21"
    services:
      - { port: 22, proto: ssh, engine: cowrie, instance: cowrie-oficina-01,
          banner: "OpenSSH_8.9" }
    tags: [office, windows]

  - id: srv-files-01
    role: server
    segment: vlan-servidores
    ip: 10.20.0.10
    persona:
      vendor: generic
      os: ubuntu
      hostname: FILES01
      mac: "00:1c:42:20:10:10"
    tags: [fileserver, linux]

  - id: cam-entrada-01
    role: camera
    segment: vlan-camaras
    ip: 10.30.0.11
    persona:
      vendor: hikvision
      os: linux
      hostname: CAM-ENTRADA
      mac: "00:12:5a:30:00:11"
    tags: [camera, iot]

# ── New: Fabric extension ──────────────────────────────────────
fabric:
  enabled: true
  name: "corporate-deception-net"

  # ── Global defaults ─────────────────────────────────────────
  defaults:
    device_image: "dystopia/fabric-device:v1"
    mem_limit: "128m"
    cpus: 0.25

  # ── Virtual Switches ────────────────────────────────────────
  switches:
    - id: sw-core
      type: ovs                        # always OVS in MVP
      stp: false                       # STP off by default for deception
      vlans: [10, 20, 30, 40]          # VLANs this switch trunks
      description: "Core aggregation switch"

    - id: sw-oficina
      type: ovs
      vlans: [10]
      uplink: sw-core                  # optional: auto-creates a trunk link

    - id: sw-servidores
      type: ovs
      vlans: [20]
      uplink: sw-core

    - id: sw-camaras
      type: ovs
      vlans: [30]
      uplink: sw-core

  # ── Links (explicit, beyond uplink auto-links) ──────────────
  links:
    - from: sw-core
      to: sw-oficina
      trunk: true
      # Emulación WAN opcional (tc netem en ambos extremos del veth).
      # latency_ms: 0–5000 · jitter_ms: 0–1000 (≤ latency_ms)
      # loss_pct: 0–100 · bandwidth_mbps: 0.1–100000 (alias deprecado: bandwidth)
      # latency_ms: 50
      # jitter_ms: 5
      # loss_pct: 0.5
      # bandwidth_mbps: 20

  # ── Device extensions (by device id) ─────────────────────────
  # Adds fabric-specific properties to devices already declared
  # in the top-level `devices:` list. A device not listed here
  # gets default fabric treatment if its segment is fabric-enabled.
  device_overrides:
    - id: pc-recepcion-01
      interfaces:
        - name: eth0
          segment: vlan-oficina
          ip: 10.10.0.21/24
          mac: "00:1c:42:10:10:21"
          gateway: 10.10.0.1
          vlan_tag: 10
          switch: sw-oficina

      credentials:
        - username: admin
          password: admin123
          service: ssh
          purpose: "Credencial señuelo para fuerza bruta"
        - username: root
          password: toor
          service: ssh
          purpose: "Credencial de alto valor"

      neighbors:
        - ip: 10.10.0.1
          mac: "00:1c:42:10:10:01"
          hostname: "gateway"
        - ip: 10.10.0.22
          mac: "00:1c:42:10:10:22"
          hostname: "RRHH-PC"

      routes:
        - destination: 0.0.0.0/0
          gateway: 10.10.0.1
        - destination: 10.20.0.0/24
          gateway: 10.10.0.1

      admin_behavior:
        management_protocol: ssh
        management_port: 22
        login_banner: "RECEPCION-PC login:"
        motd: "Authorized users only. All activity is monitored."
        shell_prompt: "C:\\Users\\admin>"
        idle_timeout: 300

      logging:
        syslog_target: "10.20.0.10"
        log_level: info
        forward_to_dystopia: true

      resources:
        image: "dystopia/fabric-device:v1"
        mem_limit: "128m"
        cpus: 0.25

    - id: srv-files-01
      interfaces:
        - name: eth0
          segment: vlan-servidores
          ip: 10.20.0.10/24
          mac: "00:1c:42:20:10:10"
          gateway: 10.20.0.1
          vlan_tag: 20
          switch: sw-servidores
      credentials:
        - username: admin
          password: P@ssw0rd
          service: ssh
      neighbors:
        - ip: 10.20.0.1
          mac: "00:1c:42:20:00:01"
          hostname: "gateway"
      routes:
        - destination: 0.0.0.0/0
          gateway: 10.20.0.1
      admin_behavior:
        management_protocol: ssh
        management_port: 22
        login_banner: "Ubuntu 22.04.3 LTS"
        shell_prompt: "admin@files01:~$"
        idle_timeout: 600
      logging:
        forward_to_dystopia: true

    - id: cam-entrada-01
      interfaces:
        - name: eth0
          segment: vlan-camaras
          ip: 10.30.0.11/24
          mac: "00:12:5a:30:00:11"
          gateway: 10.30.0.1
          vlan_tag: 30
          switch: sw-camaras
      credentials:
        - username: admin
          password: "12345"
          service: http
          purpose: "Default camera credentials"
      admin_behavior:
        management_protocol: http
        management_port: 80
        login_banner: "Hikvision Digital Technology"
      logging:
        forward_to_dystopia: true
