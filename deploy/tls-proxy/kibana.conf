# Kibana-only TLS virtual host. No route targets Elasticsearch.
server {
	listen 127.0.0.1:8443 ssl;
	server_name kibana.mgmt.example.invalid;

	ssl_certificate /etc/dystopia/tls-proxy/certs/reverse-proxy.crt;
	ssl_certificate_key /etc/dystopia/tls-proxy/certs/reverse-proxy.key;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_session_cache shared:TLS:10m;
	ssl_session_timeout 10m;

	# Replace/add approved analyst CIDRs before changing the loopback bind.
	allow 127.0.0.1;
	allow ::1;
	deny all;

	add_header Strict-Transport-Security "max-age=31536000" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "no-referrer" always;
	add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

	location = /api/deception {
		return 404;
	}
	location ^~ /api/deception/ {
		return 404;
	}

	# Kibana health endpoint is intentionally served through this TLS proxy.
	location = /api/status {
		proxy_pass https://127.0.0.1:5601;
		include /etc/dystopia/tls-proxy/kibana-proxy-headers.conf;
	}

	location / {
		proxy_pass https://127.0.0.1:5601;
		include /etc/dystopia/tls-proxy/kibana-proxy-headers.conf;
	}
}
