# Main nginx.conf template. Install the two server snippets next to this file
# under /etc/dystopia/tls-proxy/ before validating/reloading nginx.
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
	worker_connections 512;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	server_tokens off;
	access_log off;
	sendfile on;
	keepalive_timeout 30;

	map $http_upgrade $connection_upgrade {
		default upgrade;
		'' close;
	}

	include /etc/dystopia/tls-proxy/kibana.conf;
	include /etc/dystopia/tls-proxy/control.conf;
}
