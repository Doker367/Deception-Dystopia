# Optional Dystopia control plane. The separate TLS port is loopback-only by
# default; do not make it public. Access logging and proxy caching are off to
# minimize personal/operational data retention. /api/deception is never routed.
server {
	listen 127.0.0.1:9443 ssl;
	server_name control.mgmt.example.invalid;

	ssl_certificate /etc/dystopia/tls-proxy/certs/reverse-proxy.crt;
	ssl_certificate_key /etc/dystopia/tls-proxy/certs/reverse-proxy.key;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_session_cache shared:TLS:10m;
	ssl_session_timeout 10m;
	access_log off;

	# Replace/add approved administrator CIDRs before changing the loopback bind.
	allow 127.0.0.1;
	allow ::1;
	deny all;

	add_header Strict-Transport-Security "max-age=31536000" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "no-referrer" always;
	add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
	add_header Cache-Control "no-store, private" always;
	add_header Pragma "no-cache" always;

	location = /api/deception {
		return 404;
	}
	location ^~ /api/deception/ {
		return 404;
	}

	location / {
		proxy_pass http://127.0.0.1:8082;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Proto https;
		# Do not forward client identifiers or request bodies into application
		# audit logs by default. The API sees the local proxy as its peer.
		proxy_set_header X-Forwarded-For "";
		proxy_set_header X-Real-IP "";
		proxy_set_header Forwarded "";
		proxy_buffering off;
		proxy_cache off;
		proxy_hide_header Cache-Control;
		proxy_hide_header Expires;
		proxy_read_timeout 60s;
	}
}
