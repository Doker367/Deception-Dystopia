# EJEMPLO: integrar estos valores en /etc/wireguard/wg0.conf SOLO en el servidor.
# No copiar este archivo encima de una configuración WireGuard existente.
# No versionar claves privadas, claves públicas reales ni Endpoint real.
[Interface]
Address = 10.66.0.3/24
PrivateKey = REPLACE_WITH_PRIVATE_KEY_LOCALLY
Table = off

[Peer]
PublicKey = REPLACE_WITH_VPS_PUBLIC_KEY_LOCALLY
Endpoint = REPLACE_WITH_VPS_HOSTNAME:REPLACE_WITH_WG_UDP_PORT
AllowedIPs = 10.66.0.0/24, 0.0.0.0/0
PersistentKeepalive = 25
