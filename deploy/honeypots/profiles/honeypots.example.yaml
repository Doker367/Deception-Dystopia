# Dystopia — plantilla de perfil de honeypots (NO EJECUTAR SIN AUTORIZACIÓN)
#
# Esta plantilla es un manifiesto de referencia. No publica puertos, no usa
# red host, no monta el socket Docker ni /proc del host y todos los servicios
# están detrás del profile "authorized-activation": `docker compose up` sin
# ese profile no arranca nada. Cada servicio usa su propio bridge interno.
#
# Antes de cualquier activación autorizada:
#   1. Validar aislamiento en una celda de sensor aislada (internal=true no es
#      evidencia de contención).
#   2. Crear y asignar los directorios de ${DYSTOPIA_HONEYPOT_DATA} con el
#      uid/gid indicado en inventory.yaml.
#   3. Revisar digests, CVEs, licencias y el transporte del sensor.
#   4. Exponer tráfico mediante la política de red/nft de la celda, nunca
#      publicando puertos de gestión en el host.
#
# Imágenes: esta plantilla usa tags explícitos porque no hay `local_digest`
# revisado para las imágenes construidas. Es material de laboratorio, no
# producción. El render de `runtime.honeypots` exige `image_policy:
# digest-required` y `repo@sha256:<digest>` para el camino de activación;
# no sustituir los tags por digests inventados.
#
# Los límites son los recomendados en inventory.yaml.
name: dystopia-honeypots

x-honeypot-common: &honeypot-common
  restart: "no"
  read_only: true
  init: true
  stop_grace_period: 30s
  cap_drop:
    - ALL
  profiles:
    - authorized-activation
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  labels:
    dystopia.role: honeypot
    dystopia.activation: manual-authorized-only

services:
  cowrie:
    <<: *honeypot-common
    build:
      context: ../../docker/deception/cowrie
      dockerfile: Dockerfile
    image: dystopia/honeypot-cowrie:3.1.4
    security_opt:
      - no-new-privileges:true
    expose:
      - "2222"
      - "2223"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - type: bind
        source: ${DYSTOPIA_HONEYPOT_DATA:-/var/lib/dystopia/honeypots}/cowrie/var
        target: /cowrie/cowrie-git/var
    mem_limit: 512m
    cpus: 0.50
    pids_limit: 256
    ulimits:
      nofile: {soft: 4096, hard: 4096}
      core: {soft: 0, hard: 0}
    networks:
      - cowrie_net

  opencanary:
    <<: *honeypot-common
    build:
      context: ../../docker/deception/opencanary
      dockerfile: Dockerfile
    image: dystopia/honeypot-opencanary:0.9.10
    security_opt:
      - no-new-privileges:true
    cap_add:
      - NET_BIND_SERVICE
    expose:
      - "21"
      - "22"
      - "23"
      - "80"
      - "3306"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /run:rw,noexec,nosuid,size=16m
    volumes:
      - type: bind
        source: ${DYSTOPIA_HONEYPOT_DATA:-/var/lib/dystopia/honeypots}/opencanary/log
        target: /var/log/opencanary
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 128
    ulimits:
      nofile: {soft: 2048, hard: 2048}
      core: {soft: 0, hard: 0}
    networks:
      - opencanary_net

  dionaea:
    <<: *honeypot-common
    build:
      context: ../../docker/deception/dionaea
      dockerfile: Dockerfile
    image: dystopia/honeypot-dionaea:0.12.5
    security_opt:
      - no-new-privileges:true
    cap_add:
      - NET_BIND_SERVICE
    expose:
      - "21"
      - "69/udp"
      - "81"
      - "135"
      - "443"
      - "445"
      - "1433"
      - "1723"
      - "1883"
      - "3306"
      - "27017"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    volumes:
      - type: bind
        source: ${DYSTOPIA_HONEYPOT_DATA:-/var/lib/dystopia/honeypots}/dionaea/var
        target: /opt/dionaea/var
    mem_limit: 768m
    cpus: 1.00
    pids_limit: 512
    ulimits:
      nofile: {soft: 4096, hard: 4096}
      core: {soft: 0, hard: 0}
    networks:
      - dionaea_net

  heralding:
    <<: *honeypot-common
    build:
      context: ../../docker/deception/heralding
      dockerfile: Dockerfile
    image: dystopia/honeypot-heralding:ac12724
    security_opt:
      - no-new-privileges:true
    cap_add:
      - NET_BIND_SERVICE
    expose:
      - "21"
      - "22"
      - "23"
      - "25"
      - "80"
      - "110"
      - "143"
      - "443"
      - "3306"
      - "3389"
      - "5432"
      - "5900"
    tmpfs:
      - /tmp/heralding:rw,noexec,nosuid,size=32m,uid=2000,gid=2000
    volumes:
      - type: bind
        source: ${DYSTOPIA_HONEYPOT_DATA:-/var/lib/dystopia/honeypots}/heralding/log
        target: /var/log/heralding
    mem_limit: 512m
    cpus: 0.50
    pids_limit: 256
    ulimits:
      nofile: {soft: 4096, hard: 4096}
      core: {soft: 0, hard: 0}
    networks:
      - heralding_net

  redishoneypot:
    <<: *honeypot-common
    build:
      context: ../../docker/deception/redishoneypot
      dockerfile: Dockerfile
    image: dystopia/honeypot-redishoneypot:45adc62
    security_opt:
      - no-new-privileges:true
    expose:
      - "6379"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    volumes:
      - type: bind
        source: ${DYSTOPIA_HONEYPOT_DATA:-/var/lib/dystopia/honeypots}/redishoneypot/log
        target: /var/log/redishoneypot
    mem_limit: 192m
    cpus: 0.25
    pids_limit: 128
    ulimits:
      nofile: {soft: 2048, hard: 2048}
      core: {soft: 0, hard: 0}
    networks:
      - redishoneypot_net

  endlessh:
    <<: *honeypot-common
    build:
      context: ../../docker/deception/endlessh
      dockerfile: Dockerfile
    image: dystopia/honeypot-endlessh:dfe44eb
    security_opt:
      - no-new-privileges:true
    expose:
      - "2222"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - type: bind
        source: ${DYSTOPIA_HONEYPOT_DATA:-/var/lib/dystopia/honeypots}/endlessh/log
        target: /var/log/endlessh
    mem_limit: 64m
    cpus: 0.10
    pids_limit: 64
    ulimits:
      nofile: {soft: 8192, hard: 8192}
      core: {soft: 0, hard: 0}
    networks:
      - endlessh_net

networks:
  cowrie_net:
    driver: bridge
    internal: true
    enable_ipv6: false
  opencanary_net:
    driver: bridge
    internal: true
    enable_ipv6: false
  dionaea_net:
    driver: bridge
    internal: true
    enable_ipv6: false
  heralding_net:
    driver: bridge
    internal: true
    enable_ipv6: false
  redishoneypot_net:
    driver: bridge
    internal: true
    enable_ipv6: false
  endlessh_net:
    driver: bridge
    internal: true
    enable_ipv6: false
