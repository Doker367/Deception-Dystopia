# Dystopia — inventario estático de honeypots
#
# ESTADO: referencia estática. No es un despliegue ejecutable. No publica
# puertos, no usa red host y no debe arrancarse sin autorización expresa,
# revisión de aislamiento y una celda de sensor aislada y validada.
#
# Las rutas de log son rutas dentro del contenedor. Para el adaptador se
# montan en el host bajo ${DYSTOPIA_HONEYPOT_DATA:-/var/lib/dystopia/honeypots}.
#
# Imágenes (RT-10): `base_digest` fija la imagen base del build, pero no la
# imagen local `dystopia/honeypot-*` que se renderiza. Este inventario no
# inventa digests locales: no se ha construido ninguna imagen en este
# entorno. Mientras no exista `local_digest` revisado por motor, el perfil
# debe declarar `image_policy: tag-lab-only` (modo de laboratorio no
# productivo). El render con `image_policy: digest-required` exige
# `local_digest` y emite `repo@sha256:<digest>`; si falta, falla cerrado.
schema: dystopia.honeypots/v1
revision: "2026-10-29"
status: static-reference-only
activation: requires-separate-authorization

network:
  topology: one-internal-bridge-per-engine
  networks: [cowrie_net, opencanary_net, dionaea_net, heralding_net, redishoneypot_net, endlessh_net]
  driver: bridge
  internal: true
  host_network: false
  publish_ports: false
  note: >-
    internal=true reduces accidental egress and lateral movement but is NOT
    containment evidence. An authorized sensor cell must provide the real
    network boundary.

storage:
  host_root: /var/lib/dystopia/honeypots
  note: >-
    El operador debe crear cada subdirectorio con el uid/gid del contenedor
    antes de activar. No se crean rutas ni volúmenes en este repositorio.

engines:
  - id: cowrie
    description: SSH/Telnet medium-interaction honeypot
    device_id: srv-files-01
    build:
      context: ../../docker/deception/cowrie
      dockerfile: Dockerfile
    image:
      local_image: dystopia/honeypot-cowrie:3.1.4
      base_reference: cowrie/cowrie:3.1.4
      base_digest: sha256:4e2d40671691ab7a4af19840918556c62316939e905bfc9ab3fc1f9e1db54e55
      upstream_commit: 085ed091a84ae1cee7f15b6e8aa549d11826a0f7
    config:
      file: cowrie.cfg
      target: /etc/cowrie/cowrie.cfg
    user: "999:999"
    ports:
      - {container: 2222, proto: tcp, purpose: ssh}
      - {container: 2223, proto: tcp, purpose: telnet}
    logs:
      path: /cowrie/cowrie-git/var/log/cowrie/cowrie.json
      format: jsonl
      fixture: fixtures/cowrie.jsonl
    volumes:
      - cowrie/var:/cowrie/cowrie-git/var
    healthcheck:
      type: process
      marker: twistd
      interval: 60s
      start_period: 30s
    resources:
      mem_limit: 512m
      cpus: 0.50
      pids_limit: 256
      nofile: 4096
      tmpfs_mib: 64

  - id: opencanary
    description: Multi-protocol low-interaction honeypot
    device_id: sw-access-01
    build:
      context: ../../docker/deception/opencanary
      dockerfile: Dockerfile
    image:
      local_image: dystopia/honeypot-opencanary:0.9.10
      base_reference: python:3.12.8-slim-bookworm
      base_digest: sha256:2199a62885a12290dc9c5be3ca0681d367576ab7bf037da120e564723292a2f0
      package: opencanary==0.9.10
      upstream_commit: fb12e4fefbdb1b9acd1e5561a2614f827ab639ff
    config:
      file: opencanary.conf
      target: /etc/opencanaryd/opencanary.conf
    user: "2000:2000"
    capabilities_add: [NET_BIND_SERVICE]
    ports:
      - {container: 21, proto: tcp, purpose: ftp}
      - {container: 22, proto: tcp, purpose: ssh}
      - {container: 23, proto: tcp, purpose: telnet}
      - {container: 80, proto: tcp, purpose: http}
      - {container: 3306, proto: tcp, purpose: mysql}
    logs:
      path: /var/log/opencanary/opencanary.log
      format: jsonl
      fixture: fixtures/opencanary.jsonl
    volumes:
      - opencanary/log:/var/log/opencanary
    healthcheck:
      type: process
      marker: opencanaryd
      interval: 60s
      start_period: 30s
    resources:
      mem_limit: 256m
      cpus: 0.25
      pids_limit: 128
      nofile: 2048
      tmpfs_mib: 16

  - id: dionaea
    description: SMB/FTP/TFTP/HTTP/database multi-protocol honeypot
    device_id: srv-files-01
    build:
      context: ../../docker/deception/dionaea
      dockerfile: Dockerfile
    image:
      local_image: dystopia/honeypot-dionaea:0.12.5
      base_reference: ubuntu:26.04
      base_digest: sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c
      upstream_commit: 4e459f1b672a5b4c1e8335c0bff1b93738019215
    config:
      file: dionaea.cfg
      target: /opt/dionaea/etc/dionaea/dionaea.cfg
    user: "2000:2000"
    capabilities_add: [NET_BIND_SERVICE]
    ports:
      - {container: 21, proto: tcp, purpose: ftp}
      - {container: 69, proto: udp, purpose: tftp}
      - {container: 81, proto: tcp, purpose: http}
      - {container: 135, proto: tcp, purpose: epmap}
      - {container: 443, proto: tcp, purpose: https}
      - {container: 445, proto: tcp, purpose: smb}
      - {container: 1433, proto: tcp, purpose: mssql}
      - {container: 1723, proto: tcp, purpose: pptp}
      - {container: 1883, proto: tcp, purpose: mqtt}
      - {container: 3306, proto: tcp, purpose: mysql}
      - {container: 27017, proto: tcp, purpose: mongodb}
    logs:
      path: /opt/dionaea/var/log/dionaea.json
      format: jsonl
      fixture: fixtures/dionaea.jsonl
    volumes:
      - dionaea/var:/opt/dionaea/var
    healthcheck:
      type: process
      marker: dionaea
      interval: 60s
      start_period: 45s
    resources:
      mem_limit: 768m
      cpus: 1.00
      pids_limit: 512
      nofile: 4096
      tmpfs_mib: 128

  - id: heralding
    description: Credential-capturing multi-protocol honeypot
    device_id: srv-db-01
    build:
      context: ../../docker/deception/heralding
      dockerfile: Dockerfile
    image:
      local_image: dystopia/honeypot-heralding:ac12724
      base_reference: alpine:3.23.7
      base_digest: sha256:ff7f0c727dd796aa36787bfcd9a64bf35a6ce72a73451b3359fde849b6703d63
      upstream_commit: ac12724ab38c4e2fe78f07d1bc35e6e586ba69c0
    config:
      file: heralding.yml
      target: /etc/heralding/heralding.yml
    user: "2000:2000"
    capabilities_add: [NET_BIND_SERVICE]
    ports:
      - {container: 21, proto: tcp, purpose: ftp}
      - {container: 22, proto: tcp, purpose: ssh}
      - {container: 23, proto: tcp, purpose: telnet}
      - {container: 25, proto: tcp, purpose: smtp}
      - {container: 80, proto: tcp, purpose: http}
      - {container: 110, proto: tcp, purpose: pop3}
      - {container: 143, proto: tcp, purpose: imap}
      - {container: 443, proto: tcp, purpose: https}
      - {container: 3306, proto: tcp, purpose: mysql}
      - {container: 3389, proto: tcp, purpose: rdp}
      - {container: 5432, proto: tcp, purpose: postgresql}
      - {container: 5900, proto: tcp, purpose: vnc}
    logs:
      path: /var/log/heralding/sessions.jsonl
      format: jsonl
      secondary_paths:
        - /var/log/heralding/auth.csv
        - /var/log/heralding/sessions.csv
      fixture: fixtures/heralding.jsonl
    volumes:
      - heralding/log:/var/log/heralding
    healthcheck:
      type: process
      marker: heralding
      interval: 60s
      start_period: 30s
    resources:
      mem_limit: 512m
      cpus: 0.50
      pids_limit: 256
      nofile: 4096
      tmpfs_mib: 32

  - id: redishoneypot
    description: Redis protocol honeypot
    device_id: srv-db-01
    build:
      context: ../../docker/deception/redishoneypot
      dockerfile: Dockerfile
    image:
      local_image: dystopia/honeypot-redishoneypot:45adc62
      base_reference: alpine:3.23.7
      base_digest: sha256:ff7f0c727dd796aa36787bfcd9a64bf35a6ce72a73451b3359fde849b6703d63
      upstream_commit: 45adc622a423d12d76392c3a54274f6cff111d58
    config:
      file: redis.conf
      target: /opt/redishoneypot/redis.conf
    user: "2000:2000"
    ports:
      - {container: 6379, proto: tcp, purpose: redis}
    logs:
      path: /var/log/redishoneypot/redishoneypot.log
      format: jsonl
      fixture: fixtures/redishoneypot.jsonl
    volumes:
      - redishoneypot/log:/var/log/redishoneypot
    healthcheck:
      type: process
      marker: RedisHoneyPot
      interval: 60s
      start_period: 15s
    resources:
      mem_limit: 192m
      cpus: 0.25
      pids_limit: 128
      nofile: 2048
      tmpfs_mib: 32

  - id: endlessh
    description: SSH tarpit
    device_id: fw-edge-01
    build:
      context: ../../docker/deception/endlessh
      dockerfile: Dockerfile
    image:
      local_image: dystopia/honeypot-endlessh:dfe44eb
      base_reference: alpine:3.23.7
      base_digest: sha256:ff7f0c727dd796aa36787bfcd9a64bf35a6ce72a73451b3359fde849b6703d63
      upstream_commit: dfe44eb2c5b6fc3c48a39ed826fe0e4459cdf6ef
    config:
      file: endlessh.conf
      target: /opt/endlessh/endlessh.conf
    user: "2000:2000"
    ports:
      - {container: 2222, proto: tcp, purpose: ssh-tarpit}
    logs:
      path: /var/log/endlessh/endlessh.log
      format: text
      fixture: fixtures/endlessh.log
    volumes:
      - endlessh/log:/var/log/endlessh
    healthcheck:
      type: process
      marker: endlessh
      interval: 60s
      start_period: 15s
    resources:
      mem_limit: 64m
      cpus: 0.10
      pids_limit: 64
      nofile: 8192
      tmpfs_mib: 16

totals:
  mem_limit: 2304m
  cpus: 2.60
  pids_limit: 1344
  recommendation: >-
    4 vCPU / 4 GiB para una celda de sensor con margen para SO, agente de
    transporte, rotación de logs y picos de Dionaea/Endlessh.
